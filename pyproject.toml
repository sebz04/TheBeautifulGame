[project]
name = "matchmind"
version = "0.1.0"
description = "Explainable, personalized match intelligence from synthetic football data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "pyarrow>=26.0.0",
    "sqlalchemy>=2.0",
    "mcp>=1.9",
    "agent-framework-core>=1.23,<2",
    "agent-framework-foundry>=1.15,<2",
    "azure-identity>=1.17",
    "azure-monitor-opentelemetry-exporter>=1.0.0b58",
    "opentelemetry-sdk>=1.39",
]

[project.scripts]
matchmind = "matchmind.cli:main"

[project.optional-dependencies]
azure = [
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    "pyodbc>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-licenses>=5.0",
    "floodlight>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests/reference"]
asyncio_mode = "auto"
addopts = "-q -m 'not slow'"
markers = ["slow: long simulations (season budget, attribute effects); run with -m slow"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Third-party code vendored verbatim for test parity checks.
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# One row per club / name table reads better than wrapped rows.
"src/matchmind/league/clubs.py" = ["E501"]
"src/matchmind/league/names.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["azure.*"]  # optional `azure` extra: not installed in CI
ignore_missing_imports = true
