# Azure Developer CLI: `azd provision` creates infra/. The API + website image is built by
# GitHub Actions (ghcr.io) and deployed with `az containerapp update` (.github/workflows/
# deploy.yml): ACR builds are paused on Azure for Students, so `azd deploy` isn't used.
name: matchmind
services:
  api:
    project: .
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
