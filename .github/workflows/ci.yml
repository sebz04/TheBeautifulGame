name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Tests
        run: uv run pytest
      - name: License gate
        run: uv run python scripts/check_licenses.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web checks
        run: |
          if [ -f web/package.json ]; then
            echo "web/ exists: add npm ci, test and build steps (TASK-23)." && exit 1
          fi
          echo "No web/ app yet; skipping until TASK-23."
