# Build the API + website image on GitHub's runners and publish it to GitHub Container
# Registry. Azure for Students can't run registry builds (ACR Tasks are paused on
# free-credit subscriptions), so the container app pulls this public image instead.
# The image holds no secrets: settings and identities are injected by Azure at runtime.
name: Image

on:
  push:
    branches: [main, task-24]
    paths-ignore: ["wiki/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/matchmind-api:latest
            ghcr.io/${{ github.repository_owner }}/matchmind-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=MatchMind API and website
          cache-from: type=gha
          cache-to: type=gha,mode=max
