# Deploy each image the Image workflow publishes from main: point the container app at it,
# then wait for /api/health. Signs in with GitHub OIDC (no stored secrets). Set up once:
# an Entra app registration with a federated credential for this repo's main branch, the
# Contributor role on rg-matchmind, and repository variables AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID. Until then this job is skipped.
name: Deploy

on:
  workflow_run:
    workflows: [Image]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AZURE_CLIENT_ID != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/matchmind-api:${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Point the container app at the new image
        run: az containerapp update -n ca-matchmind-api -g rg-matchmind --image "$IMAGE"
      - name: Health check
        run: |
          url="https://$(az containerapp show -n ca-matchmind-api -g rg-matchmind --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 30); do curl -fsS "$url/api/health" && exit 0; sleep 10; done; exit 1
