name: Nightly slow tests

on:
  schedule:
    - cron: "0 7 * * *"  # 02:00 in Colombia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 1 h 50 min to over 3 h on a hosted runner (2026-10-24 to 27)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Slow tests (multi-match statistics, season history, storylines, effects)
        run: uv run pytest -m slow --durations=15
